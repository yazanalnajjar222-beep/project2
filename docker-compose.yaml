services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: expense_backend
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/expense_tracker
    networks:
      - expense_network
  database:
    image: postgres:16
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - ../database/data:/var/lib/postgresql/data
    networks:
      - expense_network
networks:
  expense_network:
    driver: bridge


